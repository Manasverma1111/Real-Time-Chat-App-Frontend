<div class="chat-layout">
  <app-sidebar
    [rooms]="rooms"
    [selectedRoom]="selectedRoom"
    [loadingRooms]="loadingRooms"
    (selectRoom)="selectRoom($event)"
    (logout)="handleLogout()"
    (createRoom)="handleCreateRoom()"
  ></app-sidebar>

  <div class="chat-main">
    <app-chat-window
      [room]="selectedRoom"
      [messages]="messages"
      [currentUser]="currentUser"
      [typingUser]="typingUser"
      (sendMessage)="sendMessage($event)"
      (typing)="handleTyping()"
      (uploadFile)="uploadMedia($event)"
      (viewMembers)="handleViewMembers()"
      (leaveRoom)="handleLeaveRoom()"
      (deleteRoom)="handleDeleteRoom()"
    ></app-chat-window>
  </div>

  <!-- CREATE ROOM MODAL -->

  <div *ngIf="showCreateRoomModal" class="modal-backdrop">
    <div class="create-room-modal">
      <div class="modal-title">Create New Room</div>
      <div class="modal-subtitle">Create a room for group conversations</div>

      <!-- ROOM NAME -->

      <div class="form-group">
        <label class="form-label">Room Name</label>
        <input [(ngModel)]="newRoomName" class="form-input" placeholder="Enter room name" />
      </div>

      <!-- ROOM TYPE -->

      <div class="form-group">
        <label class="form-label">Room Type</label>
        <select [(ngModel)]="newRoomType" class="form-select">
          <option value="GROUP">Group</option>
          <option value="DM">Direct Message</option>
        </select>
      </div>

      <!-- ADD MEMBERS -->

      <div class="form-group">
        <label class="form-label">Add Members</label>

        <input
          [(ngModel)]="userSearch"
          (input)="searchUsers()"
          class="form-input"
          placeholder="Search username..."
        />

        <!-- SEARCH RESULTS -->

        <div *ngIf="searchedUsers.length" class="search-results">
          <div class="search-user" *ngFor="let user of searchedUsers" (click)="addMember(user)">
            {{ user.username }}
          </div>
        </div>

        <!-- SELECTED MEMBERS -->

        <div *ngIf="selectedMembers.length" class="selected-members">
          <div class="member-chip" *ngFor="let member of selectedMembers">
            {{ member.username }}
            <span (click)="removeMember(member.userId)">×</span>
          </div>
        </div>
      </div>

      <!-- ACTIONS -->

      <div class="modal-actions">
        <button class="btn-cancel" (click)="closeCreateRoomModal()">Cancel</button>

        <button
          class="btn-create"
          [disabled]="!newRoomName.trim() || creatingRoom"
          (click)="submitCreateRoom()"
        >
          {{ creatingRoom ? 'Creating...' : 'Create Room' }}
        </button>
      </div>
    </div>
  </div>

  <!-- MEMBERS MODAL -->

  <div *ngIf="showMembersModal" class="modal-backdrop">
    <div class="create-room-modal">
      <div class="modal-title">Room Members</div>
      <div class="modal-subtitle">Manage room members</div>

      <!-- ADD NEW MEMBER -->

      <div class="form-group">
        <label class="form-label">Add Member</label>

        <input
          [(ngModel)]="memberSearch"
          (input)="searchNewMembers()"
          class="form-input"
          placeholder="Search username..."
        />

        <div *ngIf="searchedNewMembers.length" class="search-results">
          <div
            class="search-user"
            *ngFor="let user of searchedNewMembers"
            (click)="addMemberToExistingRoom(user)"
          >
            {{ user.username }}
          </div>
        </div>
      </div>

      <!-- EXISTING MEMBERS -->

      <div *ngFor="let member of roomMembers" class="member-chip">
        {{ member.username }}

        <span (click)="removeMemberFromExistingRoom(member.userId)"> × </span>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" (click)="closeMembersModal()">Close</button>
      </div>
    </div>
  </div>
</div>
