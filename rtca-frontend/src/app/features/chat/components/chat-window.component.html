<div *ngIf="room; else noRoom" class="chat-window">
  <!-- Header -->
  <app-chat-header
    [room]="room"
    (viewMembers)="handleViewMembers()"
    (leaveRoom)="handleLeaveRoom()"
    (deleteRoom)="handleDeleteRoom()"
    (openGroupDetails)="openGroupDetails.emit()"
  ></app-chat-header>

  <!-- Messages -->
  <div class="messages-area">
    <ng-container *ngIf="messages.length > 0; else emptyState">
      <app-message-bubble
        *ngFor="let message of messages"
        [message]="message"
        (deleteForMe)="handleDeleteMessage($event)"
        (deleteForEveryone)="handleDeleteForEveryone($event)"
        (react)="handleReaction($event)"
      ></app-message-bubble>
      <div #scrollEnd></div>
    </ng-container>

    <ng-template #emptyState>
      <div class="empty-state">
        <div class="empty-icon">
          <svg
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg>
        </div>
        <p class="empty-title">Start the conversation</p>
        <p class="empty-sub">
          Say hello in <strong>{{ room?.name }}</strong>
        </p>
      </div>
    </ng-template>
  </div>
  <!-- Typing Indicator -->
  <div
    *ngIf="typingUser"
    style="padding: 0 20px 10px; font-size: 12px; color: var(--text-secondary); font-style: italic"
  >
    {{ typingUser }} is typing...
  </div>

  <!-- Input -->
  <div class="input-bar">
    <div class="input-wrapper">
      <!-- upload button -->
      <label class="upload-btn">
        <input type="file" hidden (change)="onFileSelected($event)" />

        +
      </label>
      <span class="upload-tooltip">Upload File</span>

      <input
        [(ngModel)]="text"
        placeholder="Type a message..."
        class="message-input"
        (keydown.enter)="send()"
        (input)="onTyping()"
      />
      <button class="send-btn" (click)="send()" [disabled]="!text.trim()">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </div>
  </div>
</div>

<ng-template #noRoom>
  <div class="no-room">
    <div class="no-room-icon">
      <svg
        width="32"
        height="32"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
      </svg>
    </div>
    <p class="no-room-title">Select a room</p>
    <p class="no-room-sub">Choose a room from the sidebar to start chatting</p>
  </div>
</ng-template>
