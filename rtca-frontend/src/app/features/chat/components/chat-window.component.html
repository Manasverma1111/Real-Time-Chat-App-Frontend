<div *ngIf="room; else noRoom" style="display: flex; flex-direction: column; height: 100%">
  <!-- Header -->
  <app-chat-header [room]="room"></app-chat-header>

  <!-- Messages -->
  <div
    style="flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px"
  >
    <ng-container *ngIf="messages.length > 0; else emptyState">
      <app-message-bubble *ngFor="let msg of messages" [message]="msg"> </app-message-bubble>

      <div #scrollEnd></div>
    </ng-container>

    <ng-template #emptyState>
      <div style="text-align: center; margin-top: 20px">
        <p>Start the conversation in {{ room?.name }}</p>
      </div>
    </ng-template>
  </div>

  <!-- Input -->
  <div style="display: flex; padding: 10px; border-top: 1px solid #ddd">
    <input
      [(ngModel)]="text"
      placeholder="Type a message..."
      style="flex: 1; padding: 10px"
      (keydown.enter)="send()"
    />

    <button (click)="send()" [disabled]="!text.trim()" style="margin-left: 10px">➤</button>
  </div>
</div>

<ng-template #noRoom>
  <div style="display: flex; align-items: center; justify-content: center; height: 100%">
    Select a room to start chatting
  </div>
</ng-template>
