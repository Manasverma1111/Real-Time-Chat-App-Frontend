<div class="bubble-row" [class.own]="message?.isOwn">
  <div class="bubble" [class.own]="message?.isOwn" [class.other]="!message?.isOwn">
    <div *ngIf="!message?.isOwn" class="sender-name">
      {{ message?.senderName || 'User' }}
    </div>

    <div class="bubble-text">
      {{ message?.content }}
    </div>

    <div class="bubble-time">
      {{ message?.createdAt | date: 'shortTime' }}

      <span *ngIf="message?.isOwn">
        {{ message?.seen ? ' ✓✓' : ' ✓' }}
      </span>
    </div>
  </div>
</div>
