<div class="chat-header">
  <div class="header-left">
    <app-avatar [initials]="initials" [imageUrl]="avatarUrl" [size]="36"></app-avatar>

    <div class="header-info">
      <div class="room-title">{{ room?.name }}</div>

      <div class="room-meta">
        <span class="meta-dot online"></span>

        <span class="meta-text">
          {{ room?.memberCount || 0 }} members &middot; {{ room?.onlineCount || 0 }} online
        </span>
      </div>
    </div>
  </div>

  <div class="header-actions">
    <!-- VIEW MEMBERS -->

    <button class="icon-btn" title="Members" (click)="handleViewMembers()">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>
    </button>

    <!-- MENU -->

    <div style="position: relative">
      <button class="icon-btn" (click)="toggleMenu()">⋮</button>

      <div
        *ngIf="menuOpen"
        style="
          position: absolute;
          right: 0;
          top: 40px;
          width: 180px;
          background: var(--bg-surface);
          border: 1px solid var(--border-subtle);
          border-radius: 12px;
          overflow: hidden;
          z-index: 1000;
        "
      >
        <button
          class="icon-btn"
          style="width: 100%; justify-content: flex-start; padding: 12px"
          (click)="handleOpenGroupDetails()"
        >
          Group Details
        </button>

        <button
          class="icon-btn"
          style="width: 100%; justify-content: flex-start; padding: 12px"
          (click)="handleLeaveRoom()"
        >
          Leave Group
        </button>

        <button
          class="icon-btn"
          style="width: 100%; justify-content: flex-start; padding: 12px; color: #ef4444"
          (click)="handleDeleteRoom()"
        >
          Delete Group
        </button>
      </div>
    </div>
  </div>
</div>
