<div class="chat-layout">
  <!-- SIDEBAR -->
  <app-sidebar
    [rooms]="rooms"
    [selectedRoom]="selectedRoom"
    [loadingRooms]="false"
    (selectRoom)="selectRoom($event)"
    (logout)="handleLogout()"
    (createRoom)="handleCreateRoom()"
  ></app-sidebar>

  <!-- CHAT AREA -->
  <div class="chat-main">
    <app-chat-window
      [room]="selectedRoom"
      [messages]="messages"
      [currentUser]="{}"
      (sendMessage)="sendMessage($event)"
    ></app-chat-window>
  </div>
</div>
