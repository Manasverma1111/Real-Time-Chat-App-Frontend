<div class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-dot">C</div>
      <span class="brand-name">ConnectHub</span>
    </div>

    <div class="auth-tabs">
      <button
        class="tab-btn"
        routerLink="/login"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Sign in
      </button>

      <button class="tab-btn" routerLink="/register" routerLinkActive="active">Sign up</button>
    </div>

    <!-- ✅ THIS REPLACES ngSwitch -->
    <router-outlet></router-outlet>
  </div>
</div>
