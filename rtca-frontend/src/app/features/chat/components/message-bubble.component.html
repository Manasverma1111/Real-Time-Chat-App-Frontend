<div class="bubble-row" [class.own]="message?.isOwn">
  <div class="bubble" [class.own]="message?.isOwn" [class.other]="!message?.isOwn">
    <div *ngIf="!message?.isOwn" class="sender-name">{{ message?.senderName }}</div>
    <div class="bubble-text">{{ message?.text }}</div>
    <div class="bubble-time">{{ message?.timestamp }}</div>
  </div>
</div>
