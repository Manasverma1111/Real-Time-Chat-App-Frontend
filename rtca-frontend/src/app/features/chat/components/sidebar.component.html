<div class="sidebar">
  <!-- HEADER -->
  <div class="sidebar-header">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
      <!-- BRAND -->

      <div class="brand-logo">
        <span class="brand-icon">C</span>

        <span class="brand-label">ConnectHub</span>
      </div>

      <!-- NOTIFICATION BUTTON -->

      <button
        class="btn-logout"
        style="width: 42px; height: 42px; padding: 0; position: relative; flex-shrink: 0"
        (click)="handleOpenNotifications()"
      >
        🔔

        <!-- UNREAD BADGE -->

        <span
          *ngIf="unreadCount > 0"
          style="
            position: absolute;
            top: -5px;
            right: -5px;
            min-width: 18px;
            height: 18px;
            border-radius: 999px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            font-weight: 600;
          "
        >
          {{ unreadCount }}
        </span>
      </button>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="sidebar-search">
    <div class="search-wrapper">
      <svg
        class="search-icon"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>

      <input [(ngModel)]="search" placeholder="Search rooms..." class="search-input" />
    </div>
  </div>

  <!-- ROOMS LABEL -->
  <div class="section-label">Rooms</div>

  <!-- ROOMS -->
  <div class="sidebar-rooms">
    <div *ngIf="loadingRooms" class="rooms-loading">
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
    </div>

    <app-room-list-item
      *ngFor="let room of filteredRooms"
      [room]="room"
      [isActive]="selectedRoom?.id === room.id"
      (select)="handleSelect($event)"
    ></app-room-list-item>
  </div>

  <!-- =========================
       PUBLIC GROUPS SECTION
       ========================= -->

  <div class="section-label" *ngIf="publicGroups && publicGroups.length">Discover Groups</div>

  <div class="sidebar-rooms" *ngIf="publicGroups.length" style="max-height: 220px">
    <div class="room-item" *ngFor="let room of publicGroups">
      <!-- GROUP AVATAR -->

      <div class="room-avatar">
        {{
          room?.name
            ? room.name
                .split(' ')
                .slice(0, 2)
                .map((p) => p.charAt(0).toUpperCase())
                .join('')
            : 'GR'
        }}
      </div>

      <!-- GROUP INFO -->

      <div class="room-info">
        <div class="room-name">
          {{ room.name }}
        </div>

        <div class="room-last-msg">{{ room.memberCount || 0 }} members</div>
      </div>

      <!-- JOIN BUTTON -->

      <button
        class="btn-new-room"
        style="width: auto; padding: 6px 10px; font-size: 11px; flex-shrink: 0"
        (click)="handleJoinGroup(room)"
      >
        Join
      </button>
    </div>
  </div>

  <!-- FOOTER -->

  <div class="sidebar-footer">
    <button class="btn-new-room" (click)="handleCreateRoom()">
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
      >
        <line x1="12" y1="5" x2="12" y2="19" />

        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>

      New Room
    </button>

    <!-- PROFILE BUTTON -->

    <button class="btn-logout btn-profile" (click)="openProfile.emit()">
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M20 21v-2a4 4 0 0 0-3-3.87" />

        <path d="M4 21v-2a4 4 0 0 1 3-3.87" />

        <circle cx="12" cy="7" r="4" />
      </svg>

      Profile
    </button>

    <button *ngIf="isAdmin" class="btn-logout" (click)="goToAdmin()">Admin Panel</button>

    <button class="btn-logout" (click)="handleLogout()">
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />

        <polyline points="16 17 21 12 16 7" />

        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>

      Logout
    </button>
  </div>
</div>
