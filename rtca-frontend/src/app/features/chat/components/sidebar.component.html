<div style="width: 280px; display: flex; flex-direction: column; border-right: 1px solid #ddd">
  <!-- HEADER -->
  <div style="padding: 16px; font-weight: bold">ConnectHub</div>

  <!-- SEARCH -->
  <div style="padding: 10px">
    <input [(ngModel)]="search" placeholder="Search rooms..." style="width: 100%; padding: 8px" />
  </div>

  <!-- ROOMS -->
  <div style="flex: 1; overflow: auto">
    <div *ngIf="loadingRooms">Loading...</div>

    <app-room-list-item
      *ngFor="let room of filteredRooms"
      [room]="room"
      [isActive]="selectedRoom?.id === room.id"
      (select)="handleSelect($event)"
    >
    </app-room-list-item>
  </div>

  <!-- FOOTER -->
  <div style="padding: 10px">
    <button (click)="handleCreateRoom()" style="width: 100%; margin-bottom: 8px">+ New Room</button>

    <button (click)="handleLogout()" style="width: 100%">Logout</button>
  </div>
</div>
