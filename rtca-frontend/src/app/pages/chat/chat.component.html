<div style="display: flex; height: 100vh">

  <!-- SIDEBAR -->
  <app-sidebar
    [rooms]="rooms"
    [selectedRoom]="selectedRoom"
    [loadingRooms]="false"
    (selectRoom)="selectRoom($event)"
    (logout)="handleLogout()"
  ></app-sidebar>

  <!-- CHAT AREA -->
  <div style="flex: 1; display: flex; flex-direction: column">

    <app-chat-window
      [room]="selectedRoom"
      [messages]="messages"
      [currentUser]="{}"
      (sendMessage)="sendMessage($event)"
    ></app-chat-window>

  </div>

</div>
