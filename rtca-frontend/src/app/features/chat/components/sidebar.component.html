<div class="sidebar">
  <!-- HEADER -->
  <div class="sidebar-header">
    <div class="brand-logo">
      <span class="brand-icon">C</span>
      <span class="brand-label">ConnectHub</span>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="sidebar-search">
    <div class="search-wrapper">
      <svg
        class="search-icon"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input [(ngModel)]="search" placeholder="Search rooms..." class="search-input" />
    </div>
  </div>

  <!-- ROOMS LABEL -->
  <div class="section-label">Rooms</div>

  <!-- ROOMS -->
  <div class="sidebar-rooms">
    <div *ngIf="loadingRooms" class="rooms-loading">
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
    </div>

    <app-room-list-item
      *ngFor="let room of filteredRooms"
      [room]="room"
      [isActive]="selectedRoom?.id === room.id"
      (select)="handleSelect($event)"
    ></app-room-list-item>
  </div>

  <!-- FOOTER -->
  <div class="sidebar-footer">
    <button class="btn-new-room" (click)="handleCreateRoom()">
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
      >
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      New Room
    </button>

    <button *ngIf="isAdmin" class="btn-logout" (click)="goToAdmin()">Admin Panel</button>

    <button class="btn-logout" (click)="handleLogout()">
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      Logout
    </button>
  </div>
</div>
