<div style="display: flex; justify-content: space-between">
  <div>
    <h3>{{ room?.name }}</h3>
    <p>{{ room?.members }} members • {{ room?.online }} online</p>
  </div>

  <div>
    <button (click)="panelChange.emit('members')">👥</button>
    <button (click)="panelChange.emit('notifications')">🔔</button>
    <button (click)="panelChange.emit('profile')">👤</button>
  </div>
</div>
