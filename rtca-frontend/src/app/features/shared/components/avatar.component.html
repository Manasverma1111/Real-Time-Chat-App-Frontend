<div style="position: relative; display: inline-flex; flex-shrink: 0">
  <!-- Avatar Circle -->
  <div
    [ngStyle]="{
      width: size + 'px',
      height: size + 'px',
      borderRadius: '50%',
      background: imageUrl ? 'transparent' : color + '22',
      border: '1.5px solid ' + color + '44',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      fontSize: fontSize + 'px',
      fontWeight: '500',
      color: color,
      overflow: 'hidden',
      userSelect: 'none',
    }"
  >
    <!-- If image exists -->
    <img
      *ngIf="imageUrl"
      [src]="imageUrl"
      [style.width.px]="size"
      [style.height.px]="size"
      style="object-fit: cover; border-radius: 50%"
    />

    <!-- Fallback to initials -->
    <span *ngIf="!imageUrl">
      {{ initials }}
    </span>
  </div>

  <!-- Status -->
  <span *ngIf="status" style="position: absolute; bottom: 0; right: 0">
    <app-status-dot [status]="status" [size]="Math.max(8, size * 0.28)"> </app-status-dot>
  </span>
</div>
