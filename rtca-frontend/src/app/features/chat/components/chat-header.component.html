<div class="chat-header">
  <div class="header-left">
    <div class="room-avatar-sm">{{ initials }}</div>

    <div class="header-info">
      <div class="room-title">{{ room?.name }}</div>

      <div class="room-meta">
        <span class="meta-dot online"></span>

        <span class="meta-text">
          {{ room?.memberCount || 0 }} members &middot; {{ room?.onlineCount || 0 }} online
        </span>
      </div>
    </div>
  </div>

  <div class="header-actions">
    <!-- VIEW MEMBERS -->

    <button class="icon-btn" title="Members" (click)="handleViewMembers()">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>
    </button>

    <!-- LEAVE ROOM -->

    <button class="icon-btn" title="Leave Room" (click)="handleLeaveRoom()">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
    </button>

    <!-- DELETE ROOM -->

    <button class="icon-btn" title="Delete Room" (click)="handleDeleteRoom()">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6l-1 14H6L5 6" />
        <path d="M10 11v6" />
        <path d="M14 11v6" />
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
      </svg>
    </button>
  </div>
</div>
