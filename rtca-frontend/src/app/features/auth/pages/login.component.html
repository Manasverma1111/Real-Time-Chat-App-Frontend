<div class="auth-body">
  <p class="auth-subheading">Welcome back — sign in to continue</p>

  <button type="button" class="google-btn" (click)="googleLogin()">
    <svg width="16" height="16" viewBox="0 0 24 24">
      <path
        fill="#4285F4"
        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
      />
      <path
        fill="#34A853"
        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
      />
      <path
        fill="#FBBC05"
        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
      />
      <path
        fill="#EA4335"
        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84z"
      />
    </svg>
    Continue with Google
  </button>

  <div class="auth-divider">
    <span class="divider-line"></span>
    <span class="divider-label">or</span>
    <span class="divider-line"></span>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <div class="field-label-row">
        <label>Email</label>
        <a class="forgot-link" href="#">Forgot password?</a>
      </div>
      <app-input
        type="email"
        placeholder="you@example.com"
        [control]="form.controls['email']"
      ></app-input>
    </div>

    <div class="field">
      <label>Password</label>
      <app-input
        type="password"
        placeholder="••••••••"
        [control]="form.controls['password']"
      ></app-input>
    </div>

    <div class="auth-error" *ngIf="error" role="alert">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
        <path
          d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm.75 4.25a.75.75 0 0 0-1.5 0v3.5a.75.75 0 0 0 1.5 0v-3.5zm-.75 6a.875.875 0 1 0 0-1.75.875.875 0 0 0 0 1.75z"
        />
      </svg>
      {{ error }}
    </div>

    <button type="submit" class="submit-btn" [disabled]="loading">
      <span class="btn-spinner" *ngIf="loading"></span>
      {{ loading ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
